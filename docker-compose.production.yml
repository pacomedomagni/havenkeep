version: '3.8'

# Production Docker Compose
# Uses environment variables and Docker secrets

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: havenkeep-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME}
    # Port is bound to loopback only — internal services reach Postgres
    # via the `havenkeep` bridge network, not the host port. Remove the
    # `ports:` block entirely once no operators need host-side psql.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - havenkeep
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: havenkeep-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - havenkeep
    restart: unless-stopped

  # API Server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: havenkeep-api-prod
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # Secrets read from Docker secrets files. The api's config layer
      # (config/index.ts → readSecret) prefers `*_FILE` over the inline
      # env var so we never put plaintext keys into compose env.
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      REFRESH_TOKEN_SECRET_FILE: /run/secrets/refresh_token_secret
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      OAUTH_TOKEN_ENCRYPTION_SECRET_FILE: /run/secrets/oauth_token_encryption_secret
      SENDGRID_API_KEY_FILE: /run/secrets/sendgrid_api_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      REVENUECAT_SECRET_API_KEY_FILE: /run/secrets/revenuecat_secret_api_key
      REVENUECAT_WEBHOOK_SECRET_FILE: /run/secrets/revenuecat_webhook_secret
      # Inline env (non-secret) — set in the deploy host's .env file.
      CORS_ORIGINS: ${CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      DASHBOARD_URL: ${DASHBOARD_URL}
      APP_URL: ${APP_URL}
      STRIPE_PRICE_ID_PREMIUM: ${STRIPE_PRICE_ID_PREMIUM}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      SENDGRID_REPLY_TO_EMAIL: ${SENDGRID_REPLY_TO_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_AUDIENCES: ${GOOGLE_AUDIENCES}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-app.havenkeep.mobile}
      APPLE_SERVICES_IDS: ${APPLE_SERVICES_IDS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT:-443}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-havenkeep}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    ports:
      - "${API_PORT:-3000}:3000"
    secrets:
      - jwt_secret
      - refresh_token_secret
      - stripe_secret_key
      - stripe_webhook_secret
      - oauth_token_encryption_secret
      - sendgrid_api_key
      - openai_api_key
      - revenuecat_secret_api_key
      - revenuecat_webhook_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - havenkeep
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: havenkeep-loki-prod
    # Loopback-only: logs are routed through Promtail (internal) and
    # queried via Grafana (also internal). Nothing outside the host
    # should be able to hit Loki's unauthenticated query API.
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - havenkeep
    restart: unless-stopped

  # Promtail - Log Shipper
  promtail:
    image: grafana/promtail:2.9.3
    container_name: havenkeep-promtail-prod
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - havenkeep
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped

networks:
  havenkeep:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  loki_data:
    driver: local

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  refresh_token_secret:
    file: ./secrets/refresh_token_secret.txt
  stripe_secret_key:
    file: ./secrets/stripe_secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/stripe_webhook_secret.txt
  oauth_token_encryption_secret:
    file: ./secrets/oauth_token_encryption_secret.txt
  sendgrid_api_key:
    file: ./secrets/sendgrid_api_key.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  revenuecat_secret_api_key:
    file: ./secrets/revenuecat_secret_api_key.txt
  revenuecat_webhook_secret:
    file: ./secrets/revenuecat_webhook_secret.txt
