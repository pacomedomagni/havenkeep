version: '3.8'

# HavenKeep — Production Docker Compose
#
# 3.15: this file describes a SINGLE-HOST production deploy (one VM
# behind Caddy, all services co-located on the `havenkeep` bridge
# network). It is the canonical production wiring — there is no k8s
# repo. Implications worth keeping straight when reading this:
#
# - `container_name:` is set on every service so operator commands like
#   `docker logs havenkeep-api-prod` are stable across restarts. That
#   pins us to one replica per service. A horizontal scale-out
#   (`deploy.replicas: 3`) needs the container_name pin removed AND a
#   real upstream LB in front of the API. Don't change one without the
#   other.
# - The API mounts Postgres + Redis + MinIO + Loki + Promtail + a
#   backup cron all in this file. Multi-host requires either splitting
#   the file by tier (compose-postgres.yml, compose-api.yml, …) or
#   moving to k8s.
# - 3.21: with one API replica, `DB_POOL_MAX=20` (default) leaves
#   plenty of headroom under Postgres' default `max_connections=100`.
#   Bumping the API to multiple replicas without raising
#   `max_connections` (or fronting Postgres with PgBouncer in
#   transaction-pooling mode) WILL exhaust connections under load.
#   When that day comes, set Postgres `max_connections=200` AND raise
#   `shared_buffers` to ~25% of RAM, OR introduce PgBouncer as a
#   sidecar.
#
# Uses environment variables (.env) + Docker secrets (./secrets/).

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: havenkeep-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME}
    # Port is bound to loopback only — internal services reach Postgres
    # via the `havenkeep` bridge network, not the host port. Remove the
    # `ports:` block entirely once no operators need host-side psql.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - havenkeep
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: havenkeep-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - havenkeep
    restart: unless-stopped

  # API Server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: havenkeep-api-prod
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # Secrets read from Docker secrets files. The api's config layer
      # (config/index.ts → readSecret) prefers `*_FILE` over the inline
      # env var so we never put plaintext keys into compose env.
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      REFRESH_TOKEN_SECRET_FILE: /run/secrets/refresh_token_secret
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      OAUTH_TOKEN_ENCRYPTION_SECRET_FILE: /run/secrets/oauth_token_encryption_secret
      SENDGRID_API_KEY_FILE: /run/secrets/sendgrid_api_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      REVENUECAT_SECRET_API_KEY_FILE: /run/secrets/revenuecat_secret_api_key
      REVENUECAT_WEBHOOK_SECRET_FILE: /run/secrets/revenuecat_webhook_secret
      FIREBASE_SERVICE_ACCOUNT_JSON_FILE: /run/secrets/firebase_service_account_json
      # Inline env (non-secret) — set in the deploy host's .env file.
      CORS_ORIGINS: ${CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      DASHBOARD_URL: ${DASHBOARD_URL}
      APP_URL: ${APP_URL}
      STRIPE_PRICE_ID_PREMIUM: ${STRIPE_PRICE_ID_PREMIUM}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      SENDGRID_REPLY_TO_EMAIL: ${SENDGRID_REPLY_TO_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_AUDIENCES: ${GOOGLE_AUDIENCES}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-app.havenkeep.mobile}
      APPLE_SERVICES_IDS: ${APPLE_SERVICES_IDS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT:-443}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-havenkeep}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    ports:
      - "${API_PORT:-3000}:3000"
    secrets:
      - jwt_secret
      - refresh_token_secret
      - stripe_secret_key
      - stripe_webhook_secret
      - oauth_token_encryption_secret
      - sendgrid_api_key
      - openai_api_key
      - revenuecat_secret_api_key
      - revenuecat_webhook_secret
      - firebase_service_account_json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - havenkeep
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 2.2: Database Backup Cron — runs daily at 02:00 UTC, verifies the dump
  # parses, optionally pushes to S3, prunes >30-day-old local copies. The
  # script is mounted from scripts/backup-database.sh so production uses the
  # same code path as `npm run db:backup`.
  backup:
    image: postgres:15-alpine
    container_name: havenkeep-backup-prod
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      PGPASSWORD_FILE: /run/secrets/db_password
      BACKUP_DIR: /backups
      # Optional offsite copy. Leave BACKUP_S3_BUCKET unset to skip.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes:
      - backup_data:/backups
      - ./scripts/backup-database.sh:/usr/local/bin/backup-database.sh:ro
    secrets:
      - db_password
    entrypoint: |
      /bin/sh -c '
        apk add --no-cache aws-cli >/dev/null 2>&1 || true;
        export PGPASSWORD=$$(cat /run/secrets/db_password);
        # Daily-at-02:00-UTC loop. Sleeps to the next 02:00, runs, repeats.
        while true; do
          NOW=$$(date -u +%s);
          NEXT=$$(date -u -d "tomorrow 02:00" +%s 2>/dev/null || date -ju -v+1d -f "%H:%M" "02:00" +%s);
          SLEEP=$$((NEXT - NOW));
          if [ $$SLEEP -lt 0 ]; then SLEEP=86400; fi;
          echo "[backup] next run in $${SLEEP}s";
          sleep $$SLEEP;
          /usr/local/bin/backup-database.sh || echo "[backup] run failed";
        done
      '
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - havenkeep

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: havenkeep-loki-prod
    # Loopback-only: logs are routed through Promtail (internal) and
    # queried via Grafana (also internal). Nothing outside the host
    # should be able to hit Loki's unauthenticated query API.
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      # 3.13: ship alert rules so the ruler block in loki-config.yml can
      # actually fire alerts. The ruler reads from
      # `<rules_directory>/<tenant>/*.yml`; tenant is `fake` when
      # auth_enabled=false, but mounting under `havenkeep` works because
      # Loki globs the rules directory regardless.
      - ./monitoring/loki-alerts.yml:/loki/rules/havenkeep/alerts.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      # 2.1: assert /loki/chunks is reachable; a config regression that
      # routes back to /tmp/loki would still expose /ready as healthy.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3100/ready | grep -q ready && [ -d /loki/chunks ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - havenkeep
    restart: unless-stopped

  # Promtail - Log Shipper
  promtail:
    image: grafana/promtail:2.9.3
    container_name: havenkeep-promtail-prod
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 2.1: positions persisted across restarts (see monitoring/promtail-config.yml).
      - promtail_data:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - havenkeep
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped

networks:
  havenkeep:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  loki_data:
    driver: local
  promtail_data:
    driver: local
  backup_data:
    driver: local

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  refresh_token_secret:
    file: ./secrets/refresh_token_secret.txt
  stripe_secret_key:
    file: ./secrets/stripe_secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/stripe_webhook_secret.txt
  oauth_token_encryption_secret:
    file: ./secrets/oauth_token_encryption_secret.txt
  sendgrid_api_key:
    file: ./secrets/sendgrid_api_key.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  revenuecat_secret_api_key:
    file: ./secrets/revenuecat_secret_api_key.txt
  revenuecat_webhook_secret:
    file: ./secrets/revenuecat_webhook_secret.txt
  firebase_service_account_json:
    # Service-account JSON downloaded from Firebase Console →
    # Project settings → Service accounts. Single file, full JSON
    # (no escaping). The api's readSecret() picks it up via the
    # *_FILE env var above.
    file: ./secrets/firebase_service_account_json.txt
