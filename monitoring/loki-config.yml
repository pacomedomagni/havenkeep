auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  # 2.1: persistent volume mount is at /loki — `path_prefix: /tmp/loki` would
  # write chunks to a tmpfs that disappears on every container restart.
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Retention configuration. 90 days gives us enough runway for incident
# forensics and aligns with SOC 2 Type II reasonable-retention expectations.
# If storage pressure becomes a problem, ship older logs to S3-compatible
# cold storage instead of shortening this window.
limits_config:
  retention_period: 2160h  # 90 days
  max_query_series: 100000
  max_query_parallelism: 32

# Table manager for retention
table_manager:
  retention_deletes_enabled: true
  retention_period: 2160h
