name: havenkeep_mobile
description: HavenKeep — Your Warranties. Protected.
publish_to: none
version: 1.0.0+8

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Shared Packages ---
  shared_models:
    path: ../../packages/shared_models
  shared_ui:
    path: ../../packages/shared_ui
  api_client:
    path: ../../packages/api_client

  # --- State Management ---
  flutter_riverpod: ^2.0.0
  riverpod_annotation: ^2.0.0

  # --- Navigation ---
  go_router: ^14.0.0

  # --- Local Database (Offline-First) ---
  # sqlcipher_flutter_libs ships the SQLCipher build of sqlite3 and acts as
  # a drop-in replacement for sqlite3_flutter_libs; including both crashes
  # the dex merger because they declare the same plugin class.
  drift: ^2.21.0
  sqlcipher_flutter_libs: ^0.6.8
  sqlite3: ^2.9.4

  # --- Local KV Store ---
  shared_preferences: ^2.0.0

  # --- Camera & Scanning ---
  camera: ^0.11.0
  mobile_scanner: ^7.0.0
  image_picker: ^1.0.0

  # --- Animations ---
  lottie: ^3.0.0
  smooth_page_indicator: ^1.0.0
  confetti: ^0.7.0

  # --- Calendar ---
  table_calendar: ^3.1.0

  # --- Connectivity ---
  connectivity_plus: ^6.0.0

  # --- PDF & Export ---
  pdf: ^3.0.0
  printing: ^5.0.0
  csv: ^6.0.0

  # --- Push Notifications ---
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^17.0.0

  # --- Crash reporting ---
  firebase_crashlytics: ^5.0.0

  # --- Deep Links ---
  app_links: ^6.0.0

  # --- Auth / OAuth ---
  google_sign_in: ^6.0.0
  sign_in_with_apple: ^6.0.0
  flutter_web_auth_2: ^5.0.0
  crypto: ^3.0.0

  # --- In-App Purchases ---
  purchases_flutter: ^8.0.0

  # --- Security ---
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.0.0

  # --- UI ---
  google_fonts: ^6.0.0
  cached_network_image: ^3.0.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.0

  # --- File Picking ---
  file_picker: ^8.0.0

  # --- Utilities ---
  intl: ^0.19.0
  uuid: ^4.0.0
  path: ^1.8.0
  path_provider: ^2.0.0
  # Pin the iOS implementation below the objective_c-ffi adoption.
  # path_provider_foundation 2.5+ pulls in `objective_c` whose .framework
  # isn't bundled by the current Flutter native-asset pipeline, causing
  # every path-provider call to throw "Couldn't resolve native function
  # DOBJC_initializeApi". The 2.4.x line uses plain MethodChannel + works
  # with this Flutter version (3.41.2) end-to-end.
  path_provider_foundation: ">=2.4.0 <2.5.0"
  url_launcher: ^6.0.0
  share_plus: ^12.0.0
  package_info_plus: ^8.0.0
  flutter_dotenv: ^5.0.0
  http: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.0.0
  drift_dev: ^2.21.2
  riverpod_generator: ^2.0.0
  mockito: ^5.0.0
  # One-shot launcher icon generator. Run `dart run flutter_launcher_icons`
  # after editing the config or swapping assets/icons/app-icon.png.
  flutter_launcher_icons: ^0.14.0

# Adaptive launcher icon config (Android 8+ / iOS). The plugin emits the
# mipmap-anydpi-v26 layers (foreground + background) Android needs to
# render the icon shape correctly across launchers. iOS gets a flattened
# AppIcon.appiconset rebuild.
flutter_launcher_icons:
  image_path: "assets/icons/app-icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Background colour behind the foreground layer on adaptive devices.
  # Mirrors the brand surface so the icon doesn't read as washed-out on
  # white system themes.
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/app-icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/lottie/
    - .env.development
    - .env.staging
    - .env.production
