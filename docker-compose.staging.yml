# ═══════════════════════════════════════════════════════════════════════════════
# HavenKeep Staging Environment — Shared Droplet Deployment
# ═══════════════════════════════════════════════════════════════════════════════
#
# ⚠️  This droplet also runs LONI + RESTORAE — DO NOT touch their containers!
#
# Port Mapping (20** series — HavenKeep only):
#   - API (Express):        2000
#   - Partner Dashboard:    2001
#   - Marketing Site:       2002
#   - PostgreSQL:           2032
#   - Redis:                2079
#   - MinIO API:            2090
#   - MinIO Console:        2091
#
# SSL: Handled by LONI's Caddy (loni-caddy-1) — we join loni_loni-network
#
# Usage:
#   ./scripts/deploy-staging.sh up        # Build + push + deploy
#   ./scripts/deploy-staging.sh deploy     # Push images + restart (no build)
#   ./scripts/deploy-staging.sh status     # Health check
#
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: havenkeep-stg-postgres
    restart: unless-stopped
    # Bound to loopback so the port is only reachable from the host
    # (SSH + psql). Inter-container traffic uses the bridge network.
    ports:
      - '127.0.0.1:2032:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    networks:
      - havenkeep

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis Cache
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: havenkeep-stg-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:2079:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      - havenkeep

  # ─────────────────────────────────────────────────────────────────────────────
  # MinIO Object Storage
  # ─────────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: havenkeep-stg-minio
    restart: unless-stopped
    ports:
      - '127.0.0.1:2090:9000'
      - '127.0.0.1:2091:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    networks:
      - havenkeep

  # ─────────────────────────────────────────────────────────────────────────────
  # API Server (Express)
  # ─────────────────────────────────────────────────────────────────────────────
  api:
    image: ${API_IMAGE:-havenkeep-api:staging}
    container_name: havenkeep-stg-api
    restart: unless-stopped
    ports:
      - '2000:3000'
    environment:
      NODE_ENV: staging
      PORT: 3000
      DB_HOST: havenkeep-stg-postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@havenkeep-stg-postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@havenkeep-stg-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRES_IN: 7d
      MINIO_ENDPOINT: havenkeep-stg-minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@havenkeep.com}
      SENDGRID_REPLY_TO_EMAIL: ${SENDGRID_REPLY_TO_EMAIL:-support@havenkeep.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_PREMIUM: ${STRIPE_PRICE_ID_PREMIUM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_AUDIENCES: ${GOOGLE_AUDIENCES:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REVENUECAT_SECRET_API_KEY: ${REVENUECAT_SECRET_API_KEY:-}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      APP_BASE_URL: ${APP_BASE_URL:-https://api.havenkeep.kouakoudomagni.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://havenkeep.kouakoudomagni.com}
      DASHBOARD_URL: ${DASHBOARD_URL:-https://partner.havenkeep.kouakoudomagni.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    networks:
      - havenkeep
      - loni-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Partner Dashboard (Next.js)
  # ─────────────────────────────────────────────────────────────────────────────
  partner-dashboard:
    image: ${DASHBOARD_IMAGE:-havenkeep-dashboard:staging}
    container_name: havenkeep-stg-dashboard
    restart: unless-stopped
    ports:
      - '2001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      API_URL: http://havenkeep-stg-api:3000
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3001/']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      - havenkeep
      - loni-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Marketing Site (Static — Nginx)
  # ─────────────────────────────────────────────────────────────────────────────
  marketing:
    image: ${MARKETING_IMAGE:-havenkeep-marketing:staging}
    container_name: havenkeep-stg-marketing
    restart: unless-stopped
    ports:
      - '2002:80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.15'
    networks:
      - havenkeep
      - loni-network

  # ─────────────────────────────────────────────────────────────────────────────
  # DB Migration Runner (run once, then exits)
  # ─────────────────────────────────────────────────────────────────────────────
  migrate:
    image: ${API_IMAGE:-havenkeep-api:staging}
    container_name: havenkeep-stg-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@havenkeep-stg-postgres:5432/${POSTGRES_DB}
      DB_HOST: havenkeep-stg-postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["node", "dist/db/migrations/run-migration.js"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate
    networks:
      - havenkeep

  # ─────────────────────────────────────────────────────────────────────────────
  # Loki — Log Aggregation
  # ─────────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.3
    container_name: havenkeep-stg-loki
    restart: unless-stopped
    user: "0"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      # 2.1: mount path matches `path_prefix: /loki` in loki-config.yml.
      - loki_data:/loki
      # 3.13: ship alert rules to the ruler.
      - ./monitoring/loki-alerts.yml:/loki/rules/havenkeep/alerts.yml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready && [ -d /loki/chunks ]"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      - havenkeep

  # ─────────────────────────────────────────────────────────────────────────────
  # Promtail — Log Shipper
  # ─────────────────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.3
    container_name: havenkeep-stg-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 2.1: positions persisted (see monitoring/promtail-config.yml).
      - promtail_data:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    environment:
      - ENVIRONMENT=staging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.15'
    networks:
      - havenkeep

  # ─────────────────────────────────────────────────────────────────────────────
  # Database Backup Cron (runs daily at 2 AM)
  # ─────────────────────────────────────────────────────────────────────────────
  backup:
    image: postgres:15-alpine
    container_name: havenkeep-stg-backup
    restart: unless-stopped
    environment:
      DB_HOST: havenkeep-stg-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      # Staging skips offsite by default — leave BACKUP_S3_BUCKET unset to
      # match the production wiring without paying for object storage in
      # staging.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes:
      - backup_data:/backups
      - ./scripts/backup-database.sh:/usr/local/bin/backup-database.sh:ro
    entrypoint: |
      /bin/sh -c '
        apk add --no-cache aws-cli >/dev/null 2>&1 || true;
        while true; do
          NOW=$$(date -u +%s);
          NEXT=$$(date -u -d "tomorrow 02:00" +%s 2>/dev/null || date -ju -v+1d -f "%H:%M" "02:00" +%s);
          SLEEP=$$((NEXT - NOW));
          if [ $$SLEEP -lt 0 ]; then SLEEP=86400; fi;
          echo "[backup] next run in $${SLEEP}s";
          sleep $$SLEEP;
          /usr/local/bin/backup-database.sh || echo "[backup] run failed";
        done
      '
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.10'
    networks:
      - havenkeep

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  havenkeep:
    driver: bridge
  loni-network:
    external: true
    name: loni_loni-network

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  minio_data:
  loki_data:
  promtail_data:
  backup_data:
